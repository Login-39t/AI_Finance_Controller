[project]
name = "ledgergraph-api"
version = "0.1.0"
description = "TallyProof reconciliation API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic-settings>=2.7",
  "structlog>=24.4",
  "python-multipart>=0.0.20",
  # Auth. Both are library-owned primitives: Argon2id hashing and JWT
  # signing/verification. See docs/02-tech-stack.md for why the glue
  # around them is ours rather than fastapi-users.
  "argon2-cffi>=25.1",
  "PyJWT>=2.10",
  # Pydantic's EmailStr needs it; without it the auth router fails at
  # import rather than at the first request.
  "email-validator>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgergraph_api"]
