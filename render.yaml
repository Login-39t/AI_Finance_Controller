# Hosted deployment, as code.
#
# Render runs the API and Postgres; Vercel runs the Next.js frontend
# (see docs/06-deployment.md). Splitting them is not arbitrary: Vercel is
# Next.js's home turf and its edge network is free here, while a Python
# service with a long-running background task wants a normal container.
#
# What this file deliberately does NOT contain: any secret. `sync: false`
# means Render prompts for the value once and stores it; a secret written
# here would be a secret in git, and rotating it would mean a commit.

databases:
  - name: ledgergraph-db
    databaseName: ledgergraph
    user: ledgergraph
    plan: free
    postgresMajorVersion: "16"
    # Must match the API's region below. Render's internal database
    # hostname (dpg-...-a) only resolves between services in the SAME
    # region; a database left region-less lands in the account default,
    # and the API in another region cannot resolve it - the connection
    # fails with "Name or service not known" during the migration.
    region: singapore
    ipAllowList: []          # private network only

services:
  - type: web
    name: ledgergraph-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    # The repository root, so the build can see packages/. See the
    # Dockerfile's own note.
    dockerContext: .
    region: singapore        # closest to the business timezone this reconciles in
    healthCheckPath: /healthz

    # Migrations run at container start, immediately before uvicorn - the
    # same single command docker-compose uses. The tidier option, a
    # preDeployCommand that runs once before any instance takes traffic,
    # is a paid-tier feature Render rejects on free ("pre-deploy command
    # is not supported for free tier services"). Running it at startup is
    # safe here because the free tier is a single instance, so there is no
    # second replica to race. On a paid plan with replicas, move this back
    # to preDeployCommand so the migration runs exactly once.
    dockerCommand: >-
      sh -c "cd /app/backend && alembic upgrade head &&
             cd /app && exec uvicorn ledgergraph_api.main:app --host 0.0.0.0 --port 8000"

    envVars:
      # `staging`, not `production`, and deliberately: this is the public
      # hackathon demo, and the seeded role accounts below (with a password
      # named in the README) are how a reviewer sees each role from the
      # inside. `production` forbids those accounts on purpose. Everything
      # else is unchanged from a production posture - cookies stay secure
      # and cross-site (is_local is false for anything but `local`), and
      # PERSISTENCE is pinned to postgres just below.
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"

      # Production refuses the in-memory store (no durability, no
      # constraints, no concurrent writers). config.py raises at startup
      # if this is missing under ENVIRONMENT=production, so it is set
      # explicitly rather than left to a default that would fail the boot.
      - key: PERSISTENCE
        value: postgres

      # Render substitutes the connection string. The +asyncpg driver is
      # appended by config.py, which normalises whatever the platform
      # hands it - Render emits a bare postgresql:// URL that SQLAlchemy
      # would otherwise route to psycopg2.
      - key: DATABASE_URL
        fromDatabase:
          name: ledgergraph-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true   # 256-bit, generated once, never in git

      # Seed one account per role on boot, so a reviewer can sign in as
      # analyst / reviewer / controller / admin from the login page without
      # anyone provisioning them. Permitted only because ENVIRONMENT is
      # `staging`; config.py refuses this under `production`. The shared
      # password is intentionally published (README + login page) - these
      # accounts hold synthetic data and nothing else. Set back to "false"
      # (and ENVIRONMENT to production) to lock the demo down.
      - key: SEED_DEMO_USERS
        value: "true"

      # Optional, and the clean way to get a first admin in production.
      # Production seeds no users and /auth/register only mints analysts,
      # so without this the first controller/admin needs raw SQL. Register
      # your account through the sign-in page, set this to that email, and
      # the next start promotes it to admin - idempotently. Leave blank
      # otherwise. See docs/06-deployment.md.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false

      # The exact frontend origin. A wildcard is silently ignored by
      # browsers once credentials are involved, and the refresh token is
      # a cookie.
      - key: FRONTEND_ORIGIN
        sync: false

      - key: BUSINESS_TIMEZONE
        value: Asia/Kolkata
      - key: BASE_CURRENCY
        value: INR

      # Grounded AI investigation is ON for the demo. The deterministic
      # findings stand with or without it; this only lights up the
      # Investigate button on a case. Provider and model below are the
      # verified working pair.
      #
      # REQUIRED when this is true: AI_API_KEY must be set in the Render
      # dashboard (it is sync:false, so it never lives in git) - a free
      # Groq key from console.groq.com/keys. config.py refuses to boot with
      # AI_ENABLED=true and no key, so set the key first, then sync this
      # Blueprint. Set AI_ENABLED back to "false" to run without it.
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_API_KEY
        sync: false

      # Bedrock only. Prefer an instance role where the platform
      # supports one - a long-lived access key in an env var is a
      # credential that cannot be rotated without a redeploy.
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
