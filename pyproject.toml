[tool.pytest.ini_options]
pythonpath = ["packages/domain", "packages/reconciliation", "packages/ai_investigation", "backend/src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are called in argument defaults by design;
# B008 exists for mutable defaults, which these are not.
extend-immutable-calls = [
  "fastapi.Body", "fastapi.Depends", "fastapi.File", "fastapi.Form",
  "fastapi.Header", "fastapi.Path", "fastapi.Query",
]
