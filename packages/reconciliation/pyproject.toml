[project]
name = "ledgergraph-reconciliation"
version = "0.1.0"
description = "Matching rules, grouping, bridge arithmetic, exception detection, and the auto-resolve gate. Imports nothing from backend/ or frontend/."
requires-python = ">=3.11"
dependencies = ["ledgergraph-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledgergraph_reconciliation"]
